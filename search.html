<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search school equipment by name, identification number, or category.">
  <title>Search Equipment | School Equipment Tracking System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script>window.AdminAuth.requireLogin();</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/cpsu-logo.png" alt="Central Philippines State University logo">
      <span class="brand-copy"><strong>School Equipment Tracking System</strong><span>Central Philippines State University</span></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="equipment.html">Equipment Records</a>
      <a class="active" aria-current="page" href="search.html">Search Equipment</a>
      <a href="add-equipment.html">Add Equipment</a>
      <button class="nav-logout" id="logout-button" type="button">Logout</button>
    </nav>
  </header>

  <main class="container page-content">
    <div id="equipment-state" class="message" role="status" aria-live="polite"></div>
    <section class="page-heading">
      <p class="eyebrow">Find a record</p>
      <h1>Search equipment</h1>
      <p>Search sequentially by equipment name, ID, or category.</p>
    </section>

    <form class="search-panel" id="search-form">
      <div class="control-group search-query">
        <label for="search-value">Search value</label>
        <input id="search-value" name="searchValue" type="search" autocomplete="off" placeholder="For example, EQ-001 or Computers" required>
      </div>
      <div class="control-group">
        <label for="search-field">Search in</label>
        <select id="search-field" name="searchField">
          <option value="all">Name, ID, or Category</option>
          <option value="name">Equipment Name</option>
          <option value="id">Equipment ID</option>
          <option value="category">Category</option>
        </select>
      </div>
      <button class="button" type="submit">Search equipment</button>
    </form>

    <section class="search-result-section" aria-live="polite" aria-label="Search result">
      <div id="search-message" class="message" hidden></div>
      <article id="search-result" class="detail-card" hidden></article>
    </section>
  </main>

  <footer class="site-footer"><div class="container">School Equipment Tracking System <span class="footer-university">· Central Philippines State University</span></div></footer>
  <script src="js/storage.js"></script>
  <script src="js/dsa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
